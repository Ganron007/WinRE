<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}WinRE{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='winre.css') }}">
</head>
<body>
<header class="topbar">
  <a href="/" class="topbar-brand">
    <img src="{{ url_for('static', filename='winre-logo.svg') }}" alt="">
    WinRE<span class="sub">Console</span>
  </a>
  <nav class="topbar-nav">
    {% set p = request.path %}
    <a href="/" class="{{ 'active' if p == '/' }}">Home</a>
    <a href="/run" class="{{ 'active' if p.startswith('/run') }}">Run</a>
    <a href="/packs" class="{{ 'active' if p.startswith('/packs') }}">Cases</a>
    <a href="/mcp" class="{{ 'active' if p == '/mcp' }}">MCP</a>
  </nav>
  <div class="topbar-right">
    <span class="api-health {{ 'up' if health and health.ssh else 'down' }}"
          data-tip="{{ 'FlareVM reachable' if health and health.ssh else 'FlareVM unreachable' }}">
      <span class="dot"></span>{{ 'Flare' if health and health.ssh else 'DOWN' }}
    </span>
  </div>
</header>
{% block content %}{% endblock %}
</body>
</html>
