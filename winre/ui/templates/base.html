<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}WinRE{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='winre-mark.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='winre.css') }}">
</head>
<body>
<header class="topbar">
  <a href="/" class="topbar-brand">
    <img src="{{ url_for('static', filename='winre-mark.svg') }}" alt="WinRE">
    WinRE<span class="sub">Console</span>
  </a>
  <nav class="topbar-nav">
    {% set p = request.path %}
    <a href="/" class="{{ 'active' if p == '/' }}">Home</a>
    <a href="/run" class="{{ 'active' if p.startswith('/run') }}">Run</a>
    <a href="/packs" class="{{ 'active' if p.startswith('/packs') }}">Cases</a>
    <a href="/mcp" class="{{ 'active' if p == '/mcp' }}">MCP</a>
    <a href="/settings" class="{{ 'active' if p == '/settings' }}">Settings</a>
    <a href="/help" class="{{ 'active' if p == '/help' }}">Help</a>
  </nav>
  <div class="topbar-right">
    <button class="btn ghost" style="font-size:var(--tx-xs); padding:3px 10px"
            onclick="togglePalette(true)" title="jump to pack">
      ⌘K <span class="muted">jump</span>
    </button>
    <span class="api-health {{ 'up' if health and health.ssh else 'down' }}" id="pill-flare"
          data-tip="{{ 'FlareVM reachable' if health and health.ssh else 'FlareVM unreachable' }}">
      <span class="dot"></span><span id="pill-flare-text">{{ 'Flare' if health and health.ssh else 'DOWN' }}</span>
    </span>
  </div>
</header>
{% block content %}{% endblock %}
<div id="palette" style="display:none; position:fixed; inset:0; z-index:100;
     background:rgba(0,0,0,0.55)" onclick="if(event.target===this)togglePalette(false)">
  <div style="max-width:560px; margin:12vh auto 0; background:var(--bg-1);
       border:1px solid var(--line-hi); border-radius:var(--r-md); overflow:hidden">
    <input id="paletteInput" placeholder="jump to pack (sha prefix)…" autocomplete="off"
           style="border:none; border-bottom:1px solid var(--line); border-radius:0">
    <div id="paletteList" style="max-height:320px; overflow:auto"></div>
  </div>
</div>
<script>
(function(){
  let packs = [];
  function togglePalette(show){
    const el = document.getElementById('palette');
    const open = show === undefined ? el.style.display === 'none' : show;
    el.style.display = open ? 'block' : 'none';
    if (open) {
      fetch('/api/packs').then(r => r.json()).then(j => { packs = j; render(''); });
      const inp = document.getElementById('paletteInput');
      inp.value = ''; setTimeout(() => inp.focus(), 0);
    }
  }
  function render(q){
    const ql = (q || '').toLowerCase();
    const rows = packs.filter(p => p.sha.toLowerCase().startsWith(ql)).slice(0, 12);
    document.getElementById('paletteList').innerHTML = rows.length
      ? rows.map(p => `<a href="/packs/${p.sha}" style="display:flex; gap:8px; align-items:center;
           padding:8px 12px; color:var(--tx-1)">
           <span class="mono" style="flex:1">${p.short}…</span>
           <span style="font-size:var(--tx-xs); color:var(--tx-2)">${p.source || ''} · ${p.phase || ''}</span>
         </a>`).join('')
      : '<div class="muted" style="padding:12px">no matches</div>';
  }
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault(); togglePalette();
    } else if (e.key === 'Escape') { togglePalette(false); }
  });
  document.getElementById('paletteInput').addEventListener('input', e => render(e.target.value));
  window.togglePalette = togglePalette;
})();

// Live health: pages render instantly from cached health; refresh badges
// from /health (which probes + warms the cache) without blocking paint.
(function(){
  function setBadge(el, up, upText, downText) {
    if (!el) return;
    el.classList.remove('up', 'down');
    el.classList.add(up ? 'up' : 'down');
    const t = el.querySelector('[data-htext]') || el;
    // keep inner dot span intact for api-health pills
    const label = el.querySelector('.pill-label');
    if (label) { label.textContent = up ? upText : downText; }
    else if (el.id === 'pill-flare') {
      const txt = document.getElementById('pill-flare-text');
      if (txt) txt.textContent = up ? 'Flare' : 'DOWN';
    }
  }
  async function refreshHealth(){
    try {
      const r = await fetch('/health');
      const h = await r.json();
      const pill = document.getElementById('pill-flare');
      if (pill) {
        pill.classList.remove('up', 'down');
        pill.classList.add(h.ssh ? 'up' : 'down');
        const txt = document.getElementById('pill-flare-text');
        if (txt) txt.textContent = h.ssh ? 'Flare' : 'DOWN';
      }
      document.querySelectorAll('[data-mcp]').forEach(el => {
        const up = !!(h.mcp && h.mcp[el.dataset.mcp]);
        el.classList.remove('up', 'down', 'danger', 'accent');
        el.classList.add(up ? 'up' : 'down');
        if (el.hasAttribute('data-mcp-text')) {
          // stat-value flavor uses accent/danger + UP/DOWN text
          el.classList.remove('up', 'down');
          el.classList.add(up ? 'accent' : 'danger');
          el.textContent = up ? 'UP' : 'DOWN';
        }
      });
      document.querySelectorAll('[data-llm]').forEach(el => {
        const up = !!h.llm;
        el.classList.remove('up', 'down', 'warn', 'accent');
        el.classList.add(up ? 'up' : 'warn');
        if (el.hasAttribute('data-llm-text')) el.textContent = up ? 'ready' : 'off';
      });
    } catch (e) { /* stay with server-rendered values */ }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', refreshHealth);
  } else { refreshHealth(); }
})();
</script>
</body>
</html>
